<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notlarım</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notlarim">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a1a;height:100vh;overflow:hidden}

  #login-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
  .login-box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:90%;max-width:380px;text-align:center}
  .login-box h1{font-size:24px;margin-bottom:8px;color:#333}
  .login-box p{font-size:14px;color:#888;margin-bottom:24px}
  .login-box input{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none;transition:border .2s}
  .login-box input:focus{border-color:#667eea}
  .login-box button{width:100%;margin-top:16px;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:opacity .2s}
  .login-box button:hover{opacity:.9}
  .login-error{color:#e74c3c;font-size:13px;margin-top:12px;display:none}

  #app{display:none;height:100vh}
  .app-container{display:flex;height:100%}

  .sidebar{width:280px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-header{padding:16px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between}
  .sidebar-header h2{font-size:18px;color:#333}
  .sidebar-actions{display:flex;gap:8px}
  .sidebar-actions button{width:36px;height:36px;border:none;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s}
  .btn-new{background:#667eea;color:#fff}
  .btn-new:hover{background:#5a6fd6}
  .btn-logout{background:#f0f0f0;color:#666}
  .btn-logout:hover{background:#e0e0e0}
  .note-list{flex:1;overflow-y:auto;padding:8px}
  .note-item{padding:12px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .15s;display:flex;justify-content:space-between;align-items:center}
  .note-item:hover{background:#f5f5f5}
  .note-item.active{background:#eef0ff}
  .note-item-info{flex:1;min-width:0}
  .note-item-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note-item-date{font-size:11px;color:#999;margin-top:2px}
  .note-item .btn-delete{opacity:0;background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:4px;transition:all .15s}
  .note-item:hover .btn-delete{opacity:1}
  .note-item .btn-delete:hover{color:#e74c3c;background:#ffeaea}

  .editor-area{flex:1;display:flex;flex-direction:column;min-width:0}
  .editor-topbar{padding:12px 20px;border-bottom:1px solid #e0e0e0;background:#fff;display:flex;align-items:center;gap:12px}
  .editor-topbar input{flex:1;font-size:20px;font-weight:600;border:none;outline:none;background:transparent;color:#333}
  .save-status{font-size:12px;color:#aaa;white-space:nowrap}
  .editor-wrapper{flex:1;display:flex;flex-direction:column;background:#fff}
  #editor-container{flex:1;overflow-y:auto}
  #editor-container .ql-editor{min-height:100%;font-size:15px;line-height:1.7;padding:20px 24px}
  .no-note{flex:1;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:18px;background:#fff}

  .mobile-header{display:none;padding:12px 16px;background:#fff;border-bottom:1px solid #e0e0e0;align-items:center;gap:12px}
  .mobile-header button{background:none;border:none;font-size:22px;cursor:pointer;color:#667eea}
  .mobile-header span{font-size:16px;font-weight:600}

  @media(max-width:768px){
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:85%;max-width:320px;z-index:100;transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 20px rgba(0,0,0,.15)}
    .sidebar.open{transform:translateX(0)}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
    .sidebar-overlay.show{display:block}
    .mobile-header{display:flex}
    #editor-container .ql-editor{padding:16px}
    .editor-topbar{padding:8px 16px}
    .editor-topbar input{font-size:17px}
  }

  .ql-toolbar{border-left:none!important;border-right:none!important;border-top:none!important;background:#fafafa;flex-wrap:wrap}
  .ql-container{border:none!important;flex:1;display:flex;flex-direction:column}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Notlarim</h1>
    <p>Devam etmek icin sifrenizi girin</p>
    <input type="password" id="password-input" placeholder="Sifre" autocomplete="current-password">
    <button id="login-btn">Giris Yap</button>
    <div class="login-error" id="login-error">Yanlis sifre, tekrar deneyin.</div>
  </div>
</div>

<div id="app">
  <div class="app-container">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Notlarim</h2>
        <div class="sidebar-actions">
          <button class="btn-new" id="btn-new" title="Yeni not">+</button>
          <button class="btn-logout" id="btn-logout" title="Cikis">&#x23FB;</button>
        </div>
      </div>
      <div class="note-list" id="note-list"></div>
    </aside>
    <main class="editor-area">
      <div class="mobile-header" id="mobile-header">
        <button id="btn-menu">&#9776;</button>
        <span>Notlarim</span>
      </div>
      <div id="editor-section" style="display:none;flex:1;display:flex;flex-direction:column">
        <div class="editor-topbar">
          <input type="text" id="note-title" placeholder="Not basligi...">
          <span class="save-status" id="save-status"></span>
        </div>
        <div class="editor-wrapper">
          <div id="editor-container"></div>
        </div>
      </div>
      <div class="no-note" id="no-note">Bir not secin veya yeni olusturun</div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const loginScreen=$('#login-screen'),appDiv=$('#app'),noteList=$('#note-list');
  const editorSection=$('#editor-section'),noNote=$('#no-note');
  const noteTitle=$('#note-title'),saveStatus=$('#save-status');

  let currentNoteId=null,notes=[],ws=null,quill=null;
  let contentDebounce=null,titleDebounce=null,updatingFromRemote=false;

  async function checkAuth(){
    try{const r=await fetch('/api/check');const d=await r.json();if(d.authed)showApp();}catch{}
  }

  $('#login-btn').onclick=doLogin;
  $('#password-input').onkeydown=e=>{if(e.key==='Enter')doLogin()};

  async function doLogin(){
    const pw=$('#password-input').value;
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(r.ok){$('#login-error').style.display='none';showApp();}
    else{$('#login-error').style.display='block';}
  }

  $('#btn-logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload();};

  function showApp(){
    loginScreen.style.display='none';appDiv.style.display='block';
    initQuill();loadNotes();connectWS();
  }

  function initQuill(){
    if(quill)return;
    quill=new Quill('#editor-container',{
      theme:'snow',placeholder:'Yazmaya baslayin...',
      modules:{toolbar:[
        [{header:[1,2,3,false]}],
        ['bold','italic','underline','strike'],
        [{color:[]},{background:[]}],
        [{list:'ordered'},{list:'bullet'}],
        ['blockquote','code-block'],
        ['link','image'],['clean']
      ]}
    });

    quill.on('text-change',(_d,_o,source)=>{
      if(source!=='user'||!currentNoteId||updatingFromRemote)return;
      saveStatus.textContent='Yaziyor...';
      clearTimeout(contentDebounce);
      contentDebounce=setTimeout(()=>{
        const content=JSON.stringify(quill.getContents());
        if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'update-content',noteId:currentNoteId,content}));
        saveStatus.textContent='Kaydedildi';
        setTimeout(()=>{if(saveStatus.textContent==='Kaydedildi')saveStatus.textContent='';},2000);
      },500);
    });

    noteTitle.oninput=()=>{
      if(!currentNoteId)return;
      clearTimeout(titleDebounce);
      titleDebounce=setTimeout(()=>{
        const title=noteTitle.value||'Yeni Not';
        if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'update-title',noteId:currentNoteId,title}));
        const n=notes.find(x=>x.id===currentNoteId);
        if(n)n.title=title;
        renderList();
      },500);
    };
  }

  async function loadNotes(){
    const r=await fetch('/api/notes');notes=await r.json();renderList();
  }

  function renderList(){
    noteList.innerHTML='';
    notes.forEach(n=>{
      const div=document.createElement('div');
      div.className='note-item'+(n.id===currentNoteId?' active':'');
      div.innerHTML=`<div class="note-item-info"><div class="note-item-title">${escHtml(n.title)}</div><div class="note-item-date">${fmtDate(n.updated_at)}</div></div><button class="btn-delete" title="Sil">&#x2715;</button>`;
      div.querySelector('.note-item-info').onclick=()=>selectNote(n.id);
      div.querySelector('.btn-delete').onclick=e=>{e.stopPropagation();deleteNote(n.id);};
      noteList.appendChild(div);
    });
  }

  async function selectNote(id){
    currentNoteId=id;
    const r=await fetch(`/api/notes/${id}`);const note=await r.json();
    noteTitle.value=note.title;
    editorSection.style.display='flex';noNote.style.display='none';
    updatingFromRemote=true;
    if(note.content){try{quill.setContents(JSON.parse(note.content));}catch{quill.setText(note.content);}}
    else{quill.setText('');}
    updatingFromRemote=false;
    renderList();closeSidebar();
  }

  $('#btn-new').onclick=async()=>{
    const r=await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Yeni Not'})});
    const note=await r.json();
    notes.unshift({id:note.id,title:note.title,updated_at:note.updated_at});
    renderList();selectNote(note.id);
  };

  async function deleteNote(id){
    if(!confirm('Bu notu silmek istediginize emin misiniz?'))return;
    await fetch(`/api/notes/${id}`,{method:'DELETE'});
    notes=notes.filter(n=>n.id!==id);
    if(currentNoteId===id){currentNoteId=null;editorSection.style.display='none';noNote.style.display='flex';}
    renderList();
  }

  function connectWS(){
    const proto=location.protocol==='https:'?'wss:':'ws:';
    ws=new WebSocket(`${proto}//${location.host}`);
    ws.onmessage=e=>{
      const msg=JSON.parse(e.data);
      if(msg.type==='content-changed'&&msg.noteId===currentNoteId){
        updatingFromRemote=true;
        try{quill.setContents(JSON.parse(msg.content));}catch{quill.setText(msg.content);}
        updatingFromRemote=false;
        saveStatus.textContent='Guncellendi';
        setTimeout(()=>{if(saveStatus.textContent==='Guncellendi')saveStatus.textContent='';},2000);
      }
      if(msg.type==='title-changed'){
        const n=notes.find(x=>x.id===msg.noteId);
        if(n)n.title=msg.title;
        if(msg.noteId===currentNoteId)noteTitle.value=msg.title;
        renderList();
      }
      if(msg.type==='note-deleted'){
        notes=notes.filter(n=>n.id!==msg.noteId);
        if(currentNoteId===msg.noteId){currentNoteId=null;editorSection.style.display='none';noNote.style.display='flex';}
        renderList();
      }
    };
    ws.onclose=()=>setTimeout(connectWS,2000);
  }

  const sidebar=$('#sidebar'),overlay=$('#sidebar-overlay');
  $('#btn-menu').onclick=()=>{sidebar.classList.add('open');overlay.classList.add('show');};
  overlay.onclick=closeSidebar;
  function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show');}

  function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function fmtDate(d){if(!d)return'';try{return new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return d;}}

  checkAuth();
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
